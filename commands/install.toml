description = "Install a Skills Hub skill by slug"
prompt = """
Install the Skills Hub skill with slug: {{args}}

1. Use the skills-hub `get_skill_detail` tool to confirm the slug exists. If it
   doesn't, use `search_skills` to find the right one and ask the user which.
2. Show the skill's name, description and page `url`, and ask the user to confirm.
3. Run this shell command to write the skill files locally:
   npx -y @skills-hub-ai/cli@0.4.4 install {{args}}
4. Report where the skill was installed and link its skills-hub.ai page.

The `install_skill` MCP tool only records an install on skills-hub.ai; it does
not write any files, so always run the CLI command above to actually install.
"""
